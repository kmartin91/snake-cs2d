# CSnake (Docker, 127.0.0.1:3210) — HTTP : validation Let's Encrypt puis redirection HTTPS
<VirtualHost *:80>
    ServerName csnake.kma.studio
    DocumentRoot /var/www/csnake
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/csnake_error.log
    CustomLog ${APACHE_LOG_DIR}/csnake_access.log combined
</VirtualHost>
