<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName csnake.kma.studio
    DocumentRoot /var/www/csnake
    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3210/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3210/
    RequestHeader set X-Forwarded-Proto https
    ErrorLog ${APACHE_LOG_DIR}/csnake_error.log
    CustomLog ${APACHE_LOG_DIR}/csnake_access.log combined
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/csnake.kma.studio/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/csnake.kma.studio/privkey.pem
</VirtualHost>
</IfModule>
